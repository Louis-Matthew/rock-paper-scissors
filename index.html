<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="intro">
      <h1>Think you can beat a computer in Rock Paper Scissors Game!!</h1>
      <p>Well try it out. There will be total of 5 rounds.</p>
    </div>

    <div class="container">
      <div class="user">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
      </div>

      <div class="output">
        <div class="result score">
          <p>Player score: <span id="playerScore"></span></p>
          <p>Computer score: <span id="computerScore"></span></p>
        </div>
        <div class="result">
          Result
          <p id="result"></p>
        </div>
      </div>
      <div class="finalResult" id="finalResult"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
